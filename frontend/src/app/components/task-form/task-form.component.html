<div class="task-form">

  @if (errorMsg) {
    <div class="error-banner">{{ errorMsg }}</div>
  }

  <div class="form-grid">

    <div class="form-group full-width">
      <label>Title <span class="req">*</span></label>
      <input type="text" [(ngModel)]="form.title" placeholder="e.g. Complete Java assignment" />
    </div>

    <div class="form-group full-width">
      <label>Description</label>
      <textarea [(ngModel)]="form.description" placeholder="Optional details…"></textarea>
    </div>

    <div class="form-group">
      <label>Subject <span class="req">*</span></label>
      <input type="text" [(ngModel)]="form.subject" placeholder="e.g. Data Structures" />
    </div>

    <div class="form-group">
      <label>Deadline <span class="req">*</span></label>
      <input type="date" [(ngModel)]="form.deadline" />
    </div>

    <div class="form-group">
      <label>Priority</label>
      <select [(ngModel)]="form.priority">
        @for (p of priorityOptions; track p) {
          <option [value]="p">{{ p }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Status</label>
      <select [(ngModel)]="form.status">
        @for (s of statusOptions; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>

  </div>

  <div class="form-actions">
    <button class="btn btn-secondary" type="button" (click)="cancel()" [disabled]="submitting">
      Cancel
    </button>
    <button class="btn btn-primary" type="button" (click)="submit()" [disabled]="submitting">
      {{ submitting ? 'Saving…' : (isEdit ? 'Update Task' : 'Create Task') }}
    </button>
  </div>

</div>
